name: Build iOS IPA (Unsigned)

on:
  workflow_dispatch:
    inputs:
      build_mode:
        description: Build mode
        type: choice
        required: true
        default: full
        options:
          - full
          - app-only
      configuration:
        description: Build configuration
        type: choice
        required: true
        default: Release
        options:
          - Release
          - Debug

jobs:
  build-ios-ipa:
    runs-on: macos-latest
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: |
          cd clipisland-ios
          xcodegen generate

      - name: Build app (no code signing)
        run: |
          cd clipisland-ios
          xcodebuild \
            -project ClipIsland.xcodeproj \
            -scheme ClipIsland \
            -configuration "${{ github.event.inputs.configuration }}" \
            -destination "generic/platform=iOS" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean build

      - name: Package IPA
        run: |
          set -euo pipefail
          cd clipisland-ios

          APP_PATH="$(find ~/Library/Developer/Xcode/DerivedData -type d -path "*Build/Products/${{ github.event.inputs.configuration }}-iphoneos/ClipIsland.app" | head -n 1)"
          if [[ -z "${APP_PATH}" ]]; then
            echo "ClipIsland.app not found."
            exit 1
          fi

          rm -rf export
          mkdir -p export/Payload
          cp -R "${APP_PATH}" export/Payload/

          if [[ "${{ github.event.inputs.build_mode }}" == "app-only" ]]; then
            rm -rf export/Payload/ClipIsland.app/PlugIns
          fi

          cd export
          /usr/bin/zip -r "ClipIsland-${{ github.event.inputs.configuration }}-${{ github.event.inputs.build_mode }}-unsigned.ipa" Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: clipisland-ipa-${{ github.event.inputs.build_mode }}-${{ github.run_number }}
          path: clipisland-ios/export/ClipIsland-${{ github.event.inputs.configuration }}-${{ github.event.inputs.build_mode }}-unsigned.ipa
          if-no-files-found: error
